name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; a cancelled run on main shows as failing on the badge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test
      - name: Check zsh hook syntax
        run: zsh -n shell/aws-switch.zsh
      - name: Build installer package
        run: scripts/package.sh
      - name: Check binary is universal
        run: lipo "build/AWS Switch.app/Contents/MacOS/AWSSwitch" -verify_arch arm64 x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AWSSwitch-pkg
          path: build/*.pkg
          retention-days: 7
          if-no-files-found: error

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh scripts/pkg/postinstall
